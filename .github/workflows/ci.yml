name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BILLING_MODE: replay
      GOOGLE_CLOUD_AGENT_ENGINE_ENABLE_TELEMETRY: 'false'
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest tests/unit tests/integration -q
